/* ═══════════ Hooks ═══════════ */
function useReveal(threshold=0.12){
  const ref=useRef(null);const[visible,setVisible]=useState(false);
  useEffect(()=>{const el=ref.current;if(!el)return;const io=new IntersectionObserver(([e])=>{if(e.isIntersecting){setVisible(true);io.disconnect();}},{threshold});io.observe(el);return()=>io.disconnect();},[threshold]);
  return[ref,visible];
}
function Counter({target,suffix,run}){
  const[n,setN]=useState(0);
  useEffect(()=>{if(!run)return;if(REDUCED()){setN(target);return;}let s=null,raf;const dur=1600;const step=(ts)=>{if(!s)s=ts;const p=Math.min((ts-s)/dur,1);setN(Math.round(target*(1-Math.pow(1-p,3))));if(p<1)raf=requestAnimationFrame(step);};raf=requestAnimationFrame(step);return()=>cancelAnimationFrame(raf);},[run,target]);
  return <span>{n}{suffix}</span>;
}

    .cta-title{font-size:clamp(38px,7vw,74px);font-weight:800;letter-spacing:-.04em;line-height:1.12;margin-bottom:30px;display:flex;flex-direction:column;gap:2px}
    .cta-a{color:var(--text)}
    .cta-b{background:linear-gradient(95deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
    .cta-btn{padding:16px 34px;font-size:16.5px;border-radius:99px;gap:10px}
    .quick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px;margin-bottom:52px}
    .quick-card{border-radius:22px;padding:18px 20px;display:flex;align-items:center;justify-content:flex-start;gap:13px;text-decoration:none;color:var(--text)}
    .quick-icon{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;order:2}
    .quick-text{display:flex;flex-direction:column;align-items:flex-end;min-width:0;order:1;flex:1}
    .quick-name{font-weight:700;font-size:15.5px;font-family:'Inter','IBM Plex Sans Arabic',sans-serif}
    .quick-handle{font-size:12.5px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
    [dir="ltr"] .quick-text{align-items:flex-start}
    .foot-icons{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-bottom:24px}
    .foot-icon{width:40px;height:40px;border-radius:13px;display:inline-flex;align-items:center;justify-content:center;color:var(--text);border:1px solid var(--gborder2);text-decoration:none;transition:transform .25s cubic-bezier(.2,.7,.2,1),background .25s}
    .foot-icon:hover{transform:translateY(-3px);background:var(--glass2)}
    .mono .cta-b{background:none;-webkit-text-fill-color:#0B0B0B;color:#0B0B0B}
    @media(max-width:520px){.quick-card{padding:15px 16px}.cta-wrap{padding:14px 0 34px}}

    /* ══════════ النمط الثالث: أبيض وأسود (Mono) ══════════ */
    .mono{
      --bg:#EFEEEA;--text:#0B0B0B;--text2:rgba(11,11,11,.52);
      --glass:#FFFFFF;--glass2:#F4F3EF;
      --gborder:rgba(11,11,11,.10);--gborder2:rgba(11,11,11,.16);
      --accent:#0B0B0B;--accent2:#0B0B0B;
      --shadow:0 14px 44px rgba(11,11,11,.10);--shadow-sm:0 1px 3px rgba(11,11,11,.05);
      font-family:${isAr?"'Tajawal'":"'Inter'"},'Tajawal','Inter',system-ui,sans-serif;
    }
    .mono .glass{background:#FFFFFF;backdrop-filter:none;-webkit-backdrop-filter:none;border:1px solid var(--gborder);box-shadow:var(--shadow-sm)}
    .mono .orb{display:none}
    .mono.noise::after{display:none}
    .mono h1{font-weight:${isAr?900:800};letter-spacing:-.035em;line-height:1.1}
    .mono .h2{font-weight:${isAr?800:700};letter-spacing:-.03em}
    .mono .eyebrow{color:rgba(11,11,11,.45)}
    .mono .grad{background:none!important;-webkit-background-clip:border-box!important;-webkit-text-fill-color:#0B0B0B!important;color:#0B0B0B!important}
    .mono .btn-primary{background:#0B0B0B;color:#fff;box-shadow:none}
    .mono .btn-primary:hover{background:#000;box-shadow:0 10px 24px rgba(11,11,11,.20)}
    .mono .btn-glass{border:1px solid var(--gborder2)}
    .mono .logo-mark{background:#0B0B0B!important;box-shadow:none!important}
    .mono .accent-btn{background:#0B0B0B;border-color:#0B0B0B;color:#fff}
    .mono .accent-btn:hover{background:#000}
    .mono .navlink.active{background:rgba(11,11,11,.06)}
    .mono .skillfill{background:#0B0B0B}
    .mono .skillbar{background:rgba(11,11,11,.09)}
    .mono .social-card{filter:grayscale(1)}
    .mono .cover{filter:grayscale(1) contrast(.95)}
    .mono .wc-glow{background:#0B0B0B!important;opacity:.05!important}
    .mono .float-chip{background:#fff;border:1px solid var(--gborder);color:#0B0B0B}
    .mono .modal-bg{background:rgba(239,238,234,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
    .mono .card-hover:hover{box-shadow:0 14px 44px rgba(11,11,11,.10)}
    .mono-pills{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px}
    .mono-pills span{font-size:12.5px;font-weight:700;letter-spacing:.01em;padding:6px 14px;border:1px solid rgba(11,11,11,.14);border-radius:99px;background:#fff;white-space:nowrap}
  `;

  return(
  <div className={"rz-root noise "+theme} dir={isAr?"rtl":"ltr"} lang={lang}>
    <style>{css}</style>
    <div className="orb" style={{width:480,height:480,top:"-8%",insetInlineStart:"-10%",background:dark?"#1a3a5c":"#a8cef0",animation:"drift1 26s ease-in-out infinite"}} aria-hidden="true"/>
    <div className="orb" style={{width:420,height:420,top:"35%",insetInlineEnd:"-12%",background:dark?"#2d2450":"#c9bce8",animation:"drift2 32s ease-in-out infinite"}} aria-hidden="true"/>
    <div className="orb" style={{width:380,height:380,bottom:"-10%",insetInlineStart:"30%",background:dark?"#123a3a":"#a8dcd0",animation:"drift3 38s ease-in-out infinite"}} aria-hidden="true"/>
    <div aria-hidden="true" style={{position:"fixed",top:0,insetInlineStart:0,height:3,width:`${progress}%`,background:"linear-gradient(90deg,var(--accent),var(--accent2))",zIndex:60,borderRadius:99}}/>

    {/* Navbar */}
    <header className="glass" style={{position:"fixed",top:scrolled?10:18,left:"50%",transform:"translateX(-50%)",zIndex:55,borderRadius:22,width:"min(96%,1080px)",padding:scrolled?"8px 16px":"12px 18px",display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,transition:"top .35s ease,padding .35s ease"}}>
      <button onClick={()=>goTo("home")} style={{background:"none",border:"none",cursor:"pointer",display:"flex",alignItems:"center",gap:10,fontFamily:"inherit",padding:0}} aria-label={t(UI.nav.home)}>
        <span className="logo-mark" style={{width:36,height:36,borderRadius:12,background:"linear-gradient(135deg,var(--accent),var(--accent2))",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontWeight:700,fontSize:14,fontFamily:"'Inter',sans-serif",boxShadow:"0 4px 14px rgba(100,140,220,.35)"}} aria-hidden="true">RA</span>
        <span style={{fontWeight:700,fontSize:15.5,color:"var(--text)",whiteSpace:"nowrap"}}>{isAr?DATA.profile.nameAr:DATA.profile.nameEn}</span>
      </button>
      <nav className="desktop-only" aria-label={isAr?"التنقل الرئيسي":"Main navigation"} style={{display:"flex",gap:2}}>{NAV_ITEMS.map(([id,l])=><button key={id} className={`navlink ${active===id?"active":""}`} onClick={()=>goTo(id)} aria-current={active===id?"true":undefined}>{t(l)}</button>)}</nav>
      <div style={{display:"flex",gap:8,alignItems:"center"}}>
        <button className="iconbtn desktop-only accent-btn" onClick={()=>setPaletteOpen(true)} aria-label="⌘K" title="⌘K"><Command size={17}/></button>
        <button className="iconbtn" onClick={()=>setLang(l=>l==="ar"?"en":"ar")} aria-label={isAr?"Switch to English":"التبديل إلى العربية"}><span style={{fontSize:12.5,fontWeight:700}}>{isAr?"EN":"ع"}</span></button>
        <button className="iconbtn" onClick={cycleTheme} aria-label={t(UI.theme[theme])} title={t(UI.theme[theme])}>{dark?<Sun size={17}/>:mono?<Moon size={17}/>:<Contrast size={17}/>}</button>
        <button className="iconbtn mobile-only" onClick={()=>setMenuOpen(v=>!v)} aria-label={menuOpen?(isAr?"إغلاق القائمة":"Close menu"):(isAr?"فتح القائمة":"Open menu")} aria-expanded={menuOpen}>{menuOpen?<XIcon size={18}/>:<MenuIcon size={18}/>}</button>
      </div>
    </header>

    {/* Mobile menu */}
    {menuOpen&&<div className="modal-bg mobile-only" style={{alignItems:"flex-start",paddingTop:90}} onClick={()=>setMenuOpen(false)}><nav className="glass pop" aria-label={isAr?"قائمة الجوال":"Mobile menu"} onClick={e=>e.stopPropagation()} style={{width:"100%",maxWidth:420,borderRadius:26,padding:14,display:"flex",flexDirection:"column",gap:4}}>{NAV_ITEMS.map(([id,l])=><button key={id} onClick={()=>goTo(id)} className={`navlink ${active===id?"active":""}`} style={{fontSize:16,padding:"14px 18px",textAlign:"start",width:"100%"}}>{t(l)}</button>)}</nav></div>}

    {/* Hero */}
    <section id="home" style={{position:"relative",zIndex:2,minHeight:"100vh",display:"flex",alignItems:"center",padding:"130px 22px 60px"}}>
      <div style={{maxWidth:1160,margin:"0 auto",width:"100%",display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(290px,1fr))",gap:50,alignItems:"center"}}>
        <div>
          <div className="eyebrow"><Sparkles size={14}/> {greeting}</div>
          {mono&&<div className="mono-pills">{UI.monoPills.map((x,i)=><span key={i}>{t(x)}</span>)}</div>}
          <h1 style={{fontSize:"clamp(38px,6.5vw,66px)",fontWeight:700,letterSpacing:"-.025em",lineHeight:1.15,marginBottom:6}}>{isAr?DATA.profile.nameAr:DATA.profile.nameEn}</h1>
          <p style={{fontSize:"clamp(17px,2.5vw,22px)",color:"var(--text2)",fontWeight:500,marginBottom:4}} dir={isAr?"ltr":"rtl"}>{isAr?DATA.profile.nameEn:DATA.profile.nameAr}</p>
          <p className="grad" style={{direction:"ltr",textAlign:isAr?"right":"left",fontSize:15.5,fontWeight:600,marginBottom:20,background:"linear-gradient(90deg,var(--accent),var(--accent2))",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>{DATA.profile.handle}</p>
          <p style={{fontSize:16.5,color:"var(--text2)",maxWidth:520,marginBottom:30}}>{isAr?DATA.profile.taglineAr:DATA.profile.taglineEn}</p>
          <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>
            <button className="btn btn-primary" onClick={()=>goTo("projects")}><Rocket size={16}/> {t(UI.hero.explore)}</button>
            <button className="btn btn-glass glass" onClick={()=>goTo("contact")}><Share2 size={16}/> {t(UI.hero.socials)}</button>
            <button className="btn btn-glass glass" onClick={()=>goTo("contact")}><Mail size={16}/> {t(UI.hero.contact)}</button>
          </div>
        </div>
        {/* Profile card */}
        <div style={{display:"flex",justifyContent:"center",position:"relative",padding:"30px 0"}}>
          <div style={{position:"relative",width:"min(310px,76vw)"}}>
            {FLOAT_CHIPS.map((c,i)=>{const Icon=c.icon;return(<span key={i} className="glass float-chip desktop-only" aria-hidden="true" style={{position:"absolute",top:c.top,insetInlineStart:c.side,width:44,height:44,borderRadius:14,display:"flex",alignItems:"center",justifyContent:"center",zIndex:3,animationDelay:c.delay+"s",color:"var(--accent)"}}><Icon size={19}/></span>);})}
            <div ref={heroCardRef} className="glass" onMouseMove={onHeroMove} onMouseLeave={onHeroLeave} style={{borderRadius:36,padding:26,textAlign:"center",transition:"transform .25s ease",willChange:"transform"}}>
              {DATA.profile.photoUrl?<img src={DATA.profile.photoUrl} alt={isAr?DATA.profile.nameAr:DATA.profile.nameEn} loading="lazy" className="cover" style={{width:"100%",aspectRatio:"1",objectFit:"cover",borderRadius:26,marginBottom:18,display:"block"}}/>:
              <div aria-hidden="true" style={{width:"100%",aspectRatio:"1",borderRadius:26,marginBottom:18,display:"flex",alignItems:"center",justifyContent:"center",background:dark?"linear-gradient(140deg,#16233a,#2a2450,#0f2c34)":"linear-gradient(140deg,#dce9f7,#e6e0f5,#d5eef0)",position:"relative",overflow:"hidden"}}>
                <span style={{position:"absolute",inset:0,background:"linear-gradient(110deg,transparent 30%,rgba(255,255,255,.14) 48%,transparent 62%)",backgroundSize:"200% 100%",animation:"shimmer 4.5s linear infinite"}}/>
                <span style={{fontSize:84,fontWeight:800,fontFamily:"'Inter',sans-serif",letterSpacing:"-.04em",background:"linear-gradient(135deg,var(--accent),var(--accent2))",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>RA</span>
              </div>}
              <div style={{fontWeight:700,fontSize:19}}>{isAr?DATA.profile.nameAr:DATA.profile.nameEn}</div>
              <div style={{fontSize:13.5,color:"var(--text2)",marginTop:4}}>📍 {isAr?DATA.profile.locationAr:DATA.profile.locationEn}</div>
            </div>
          </div>
        </div>
      </div>
    </section>

    {/* About */}
    <Section id="about" eyebrow={isAr?"من أنا":"Who I am"} title={t(UI.sections.about)}>
      <div className="glass" style={{borderRadius:28,padding:"clamp(22px,4vw,36px)",marginBottom:26}}><p style={{fontSize:17,lineHeight:1.9}}>{isAr?DATA.profile.aboutAr:DATA.profile.aboutEn}</p></div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(150px,1fr))",gap:12}}>
        {DATA.interests.slice(0,8).map((it,i)=>{const Icon=it.icon;return(<div key={i} className="glass card-hover" style={{borderRadius:18,padding:"16px 14px",display:"flex",alignItems:"center",gap:10}}><Icon size={18} style={{color:"var(--accent)",flexShrink:0}}/><span style={{fontSize:13.5,fontWeight:600}}>{isAr?it.ar:it.en}</span></div>);})}
      </div>
    </Section>

    {/* Interests */}
    <Section id="interests" eyebrow={isAr?"ما يلهمني":"What inspires me"} title={t(UI.sections.interests)}>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(230px,1fr))",gap:16}}>
        {DATA.interests.map((it,i)=>{const Icon=it.icon;return(<div key={i} className="glass card-hover" style={{borderRadius:24,padding:22,position:"relative",overflow:"hidden"}}><span aria-hidden="true" style={{position:"absolute",top:-24,insetInlineEnd:-24,width:80,height:80,borderRadius:"50%",background:"var(--accent)",opacity:0.09,filter:"blur(20px)"}}/><span style={{width:46,height:46,borderRadius:14,display:"flex",alignItems:"center",justifyContent:"center",background:dark?"rgba(124,196,247,.12)":"rgba(47,111,181,.1)",marginBottom:14}}><Icon size={21} style={{color:"var(--accent)"}}/></span><div style={{fontWeight:700,fontSize:15.5,marginBottom:5}}>{isAr?it.ar:it.en}</div><div style={{fontSize:13.5,color:"var(--text2)"}}>{isAr?it.dAr:it.dEn}</div></div>);})}
      </div>
    </Section>

    {/* Projects */}
    <Section id="projects" eyebrow={isAr?"ما أعمل عليه":"What I build"} title={t(UI.sections.projects)}>
      <div role="tablist" style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:26}}>
        {DATA.projectCategories.map(c=><button key={c.id} role="tab" aria-selected={filter===c.id} onClick={()=>setFilter(c.id)} style={{border:filter===c.id?"1px solid var(--accent)":"1px solid var(--gborder)",cursor:"pointer",borderRadius:99,padding:"8px 16px",fontSize:13,fontWeight:600,fontFamily:"inherit",color:filter===c.id?"var(--accent)":"var(--text2)",background:filter===c.id?(dark?"rgba(124,196,247,.1)":"rgba(47,111,181,.08)"):"var(--glass)",backdropFilter:"blur(14px)",WebkitBackdropFilter:"blur(14px)",transition:"all .25s"}}>{t(c)}</button>)}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(270px,1fr))",gap:20}}>
        {filteredProjects.length===0&&<div className="glass" style={{borderRadius:22,padding:30,color:"var(--text2)",gridColumn:"1/-1",textAlign:"center"}}><Filter size={22} style={{marginBottom:8}}/><div>{t(UI.projects.empty)}</div></div>}
        {filteredProjects.map(p=><article key={p.id} className="glass card-hover" style={{borderRadius:26,overflow:"hidden",display:"flex",flexDirection:"column"}}>
          <div aria-hidden="true" className="cover" style={{height:150,background:p.cover,position:"relative"}}><span style={{position:"absolute",bottom:10,insetInlineStart:12,fontSize:11.5,fontWeight:700,padding:"4px 12px",borderRadius:99,background:"rgba(0,0,0,.45)",color:"#fff",backdropFilter:"blur(8px)"}}>{catName(p.cat)}</span>{p.video&&<span aria-hidden="true" style={{position:"absolute",top:10,insetInlineEnd:12,fontSize:11,fontWeight:700,padding:"3px 10px",borderRadius:99,background:"rgba(0,0,0,.45)",color:"#fff",backdropFilter:"blur(8px)"}}>▶︎</span>}</div>
          <div style={{padding:20,display:"flex",flexDirection:"column",gap:10,flex:1}}>
            <h3 style={{fontSize:17,fontWeight:700}}>{isAr?p.tAr:p.tEn}</h3>
            <p style={{fontSize:13.5,color:"var(--text2)",flex:1}}>{isAr?p.dAr:p.dEn}</p>
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>{p.tech.map(tt=><span key={tt} style={{fontSize:11,fontWeight:600,padding:"3px 10px",borderRadius:99,background:"var(--glass2)",border:"1px solid var(--gborder)",color:"var(--text2)",direction:"ltr"}}>{tt}</span>)}</div>
            <button className="btn btn-primary" style={{padding:"9px 16px",fontSize:13,borderRadius:13,justifyContent:"center",marginTop:6}} onClick={()=>setModal(p)}>{t(UI.projects.details)}</button>
          </div>
        </article>)}
      </div>
    </Section>

    {/* Sports */}
    <Section id="sports" eyebrow={isAr?"⚽ 🚴 شغف":"⚽ 🚴 Passion"} title={t(UI.sections.sports)} subtitle={t(UI.sections.sportsSub)}>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(190px,1fr))",gap:14}}>
        {DATA.sportsCards.map((c,i)=><div key={i} className="glass card-hover" style={{borderRadius:22,padding:"24px 18px",textAlign:"center",position:"relative",overflow:"hidden"}}><span aria-hidden="true" className="wc-glow" style={{position:"absolute",bottom:-20,insetInlineStart:"50%",marginInlineStart:-50,width:100,height:60,borderRadius:"50%",background:"#1a936f",opacity:0.13,filter:"blur(22px)"}}/><div style={{fontSize:34,marginBottom:10}} aria-hidden="true">{c.icon}</div><div style={{fontWeight:700,fontSize:14.5}}>{isAr?c.ar:c.en}</div></div>)}
      </div>
    </Section>

    {/* Stats */}
    <section className="section">
      <div ref={statsRef} className={`reveal ${statsOn?"on":""}`}>
        <div className="glass" style={{borderRadius:30,padding:"clamp(26px,5vw,44px)",display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:26,textAlign:"center"}}>
          {DATA.stats.map((s,i)=><div key={i}><div className="grad" style={{fontSize:"clamp(34px,5vw,48px)",fontWeight:800,fontFamily:"'Inter',sans-serif",letterSpacing:"-.03em",background:"linear-gradient(135deg,var(--accent),var(--accent2))",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}} dir="ltr"><Counter target={s.value} suffix={s.suffix} run={statsOn}/></div><div style={{fontSize:13.5,color:"var(--text2)",fontWeight:600,marginTop:4}}>{isAr?s.ar:s.en}</div></div>)}
          <div style={{gridColumn:"1/-1",fontSize:12,color:"var(--text2)"}}>ℹ️ {t(UI.sections.statsNote)}</div>
        </div>
      </div>
    </section>

    {/* Skills */}
    <Section eyebrow={isAr?"نقاط القوة":"Strengths"} title={t(UI.sections.skills)} subtitle={t(UI.sections.skillsNote)}>
      <div ref={skillsRef} style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(250px,1fr))",gap:"16px 34px"}}>
        {DATA.skills.map((s,i)=><div key={i}><div style={{display:"flex",justifyContent:"space-between",marginBottom:7,fontSize:13.5,fontWeight:600}}><span>{isAr?s.ar:s.en}</span><span style={{color:"var(--text2)"}} dir="ltr">{s.v}%</span></div><div className="skillbar" role="progressbar" aria-valuenow={s.v} aria-valuemin={0} aria-valuemax={100}><div className="skillfill" style={{width:skillsOn?s.v+"%":"0%"}}/></div></div>)}
      </div>
    </Section>

    {/* Contact */}
    {/* Contact — نداء الختام + بطاقات التواصل + النموذج */}
    <Section id="contact">
      <div className="cta-wrap">
        <h2 className="cta-title">
          <span className="cta-a">{t(UI.cta.lineA)}</span>
          <span className="cta-b">{t(UI.cta.lineB)}</span>
        </h2>
        <button className="btn btn-primary cta-btn" onClick={()=>{const el=document.getElementById("contact-form");if(el)el.scrollIntoView({behavior:REDUCED()?"auto":"smooth",block:"center"});}}>
          {t(UI.cta.btn)} <span aria-hidden="true" style={{fontSize:17,lineHeight:1}}>↗</span>
        </button>
      </div>

      <div className="quick-grid">
        {["snapchat","telegram","whatsapp","email"].map(id=>{const s=DATA.socials.find(x=>x.id===id);if(!s)return null;const Icon=s.icon;const has=!!s.url;return(
          <a key={id} href={has?s.url:undefined} target={has?"_blank":undefined} rel={has?"noopener noreferrer":undefined} onClick={e=>{if(!has)e.preventDefault();}} aria-disabled={!has} aria-label={s.name+" — "+s.handle} className="glass card-hover social-card quick-card" style={{opacity:has?1:0.68,cursor:has?"pointer":"default"}}>
            <span className="quick-icon" style={{background:s.color+"1f",border:"1px solid "+s.color+"3d"}}><Icon size={19} style={{color:s.color}}/></span>
            <span className="quick-text">
              <span className="quick-name">{s.name}</span>
              <span className="quick-handle" dir="ltr">{has?s.handle:t(UI.socials.soon)}</span>
            </span>
          </a>);})}
      </div>

      <div id="contact-form" style={{maxWidth:680,margin:"0 auto"}}><ContactForm t={t} isAr={isAr}/></div>
    </Section>

    {/* Footer */}
    <footer style={{position:"relative",zIndex:2,maxWidth:1160,margin:"46px auto 0",padding:"0 22px 130px"}}>
      <div className="glass" style={{borderRadius:28,padding:"34px 26px",textAlign:"center"}}>
        <div className="foot-icons">
          {DATA.socials.map(s=>{const Icon=s.icon;const has=!!s.url;return(
            <a key={s.id} href={has?s.url:undefined} target={has?"_blank":undefined} rel={has?"noopener noreferrer":undefined} onClick={e=>{if(!has)e.preventDefault();}} aria-disabled={!has} aria-label={s.name} title={s.name} className="foot-icon" style={{opacity:has?1:0.4,cursor:has?"pointer":"default"}}><Icon size={17}/></a>);})}
        </div>
        <div style={{fontWeight:700,fontSize:17,marginBottom:4}}>{DATA.profile.nameAr} — <span style={{fontFamily:"'Inter',sans-serif"}}>{DATA.profile.nameEn}</span></div>
        <div className="grad" style={{fontSize:14,fontWeight:600,marginBottom:10,background:"linear-gradient(90deg,var(--accent),var(--accent2))",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",direction:"ltr"}}>{DATA.profile.handle}</div>
        <div style={{fontSize:13.5,color:"var(--text2)",marginBottom:4}}>{t(UI.footer.made)} 🤍</div>
        <div style={{fontSize:12.5,color:"var(--text2)"}}>© {year} — {t(UI.footer.rights)}</div>
      </div>
    </footer>

    <Dock t={t} isAr={isAr} goTo={goTo} onPalette={()=>setPaletteOpen(true)}/>

    {scrolled&&<button className="iconbtn" onClick={()=>goTo("home")} aria-label={isAr?"العودة إلى الأعلى":"Back to top"} style={{position:"fixed",bottom:24,insetInlineEnd:20,zIndex:50,width:46,height:46,borderRadius:16}}><ArrowUp size={19}/></button>}

    {/* Project modal */}
    {modal&&<div className="modal-bg" onClick={()=>setModal(null)} role="dialog" aria-modal="true"><div className="glass pop" onClick={e=>e.stopPropagation()} style={{width:"100%",maxWidth:620,borderRadius:30,overflow:"hidden auto",maxHeight:"85vh"}}>
      <div className="cover" style={{height:modal.video?230:190,background:modal.cover,position:"relative",overflow:"hidden"}}>{modal.video&&<video src={modal.video} autoPlay loop muted playsInline aria-label={isAr?modal.tAr:modal.tEn} style={{position:"absolute",inset:0,width:"100%",height:"100%",objectFit:"cover"}}/>}<button className="iconbtn" onClick={()=>setModal(null)} aria-label={isAr?"إغلاق":"Close"} style={{position:"absolute",top:14,insetInlineEnd:14,zIndex:2}}><XIcon size={17}/></button></div>
      <div style={{padding:"clamp(20px,4vw,30px)"}}>
        <span style={{fontSize:11.5,fontWeight:700,padding:"4px 12px",borderRadius:99,background:"var(--glass2)",border:"1px solid var(--gborder)",color:"var(--accent)"}}>{catName(modal.cat)}</span>
        <h3 style={{fontSize:24,fontWeight:700,margin:"14px 0 10px"}}>{isAr?modal.tAr:modal.tEn}</h3>
        <p style={{fontSize:15,color:"var(--text2)",marginBottom:18}}>{isAr?modal.dAr:modal.dEn}</p>
        <div style={{fontSize:12.5,fontWeight:700,color:"var(--text2)",marginBottom:8}}>{t(UI.projects.tech)}</div>
        <div style={{display:"flex",gap:7,flexWrap:"wrap",marginBottom:22}}>{modal.tech.map(tt=><span key={tt} style={{fontSize:12,fontWeight:600,padding:"5px 13px",borderRadius:99,background:"var(--glass2)",border:"1px solid var(--gborder)",direction:"ltr"}}>{tt}</span>)}</div>
        {modal.shot&&<figure style={{margin:"0 0 22px"}}><img src={modal.shot} alt={(isAr?modal.tAr:modal.tEn)+" — "+(isAr?"لقطة من الموقع":"site screenshot")} loading="lazy" style={{width:"100%",maxWidth:340,display:"block",margin:"0 auto",borderRadius:18,border:"1px solid var(--gborder)",boxShadow:"var(--shadow)"}}/><figcaption style={{fontSize:12,color:"var(--text2)",textAlign:"center",marginTop:9}}>{t(UI.projects.shot)}</figcaption></figure>}{modal.url?<a className="btn btn-primary" href={modal.url} target="_blank" rel="noopener noreferrer" style={{textDecoration:"none"}}><ExternalLink size={15}/> {t(UI.projects.view)}</a>:<button className="btn btn-glass glass" disabled style={{opacity:0.6,cursor:"default"}}><ExternalLink size={15}/> {t(UI.projects.soon)}</button>}
      </div>
    </div></div>}

    {paletteOpen&&<CommandPalette t={t} isAr={isAr} dark={dark} mono={mono} theme={theme} goTo={goTo} close={()=>setPaletteOpen(false)} openProject={p=>{setPaletteOpen(false);setModal(p);}} toggleLang={()=>{setLang(l=>l==="ar"?"en":"ar");setPaletteOpen(false);}} toggleTheme={()=>{cycleTheme();setPaletteOpen(false);}}/>}
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
